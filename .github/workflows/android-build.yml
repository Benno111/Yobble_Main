name: Android Build

on:
  push:
    paths:
      - ".github/workflows/android-build.yml"
      - "Android src/Yobble/**"
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "Android src/Yobble/**"
  workflow_dispatch:
    inputs:
      app_name:
        description: "Android app display name"
        required: false
        default: "Yobble"
      base_url:
        description: "Base URL loaded by the Android WebView"
        required: false
        default: "http://photography-cage.gl.at.ply.gg:52426"
      app_id:
        description: "Android applicationId (package id)"
        required: false
        default: "com.yobble.client"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
    defaults:
      run:
        shell: bash
        working-directory: "./Android src/Yobble"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Android app overrides
        env:
          WORKFLOW_APP_NAME: ${{ github.event.inputs.app_name }}
          WORKFLOW_BASE_URL: ${{ github.event.inputs.base_url }}
          WORKFLOW_APP_ID: ${{ github.event.inputs.app_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(".")
          app_name = os.environ.get("WORKFLOW_APP_NAME", "").strip()
          base_url = os.environ.get("WORKFLOW_BASE_URL", "").strip()
          app_id = os.environ.get("WORKFLOW_APP_ID", "").strip()

          if app_name:
              strings = root / "app/src/main/res/values/strings.xml"
              text = strings.read_text(encoding="utf-8")
              updated = re.sub(r'(<string name="app_name">)(.*?)(</string>)', r"\1" + app_name + r"\3", text, count=1, flags=re.DOTALL)
              if updated == text:
                  raise SystemExit("Unable to update app_name in strings.xml")
              strings.write_text(updated, encoding="utf-8")
              print(f"Updated app_name -> {app_name}")

          if base_url:
              activity = root / "app/src/main/java/com/Benno111/dorfplatformertimetravel/MainActivity.java"
              text = activity.read_text(encoding="utf-8")
              updated = re.sub(r'(private static final String BASE_URL = ")([^"]*)(";\s*)', r"\1" + base_url + r"\3", text, count=1)
              if updated == text:
                  raise SystemExit("Unable to update BASE_URL in MainActivity.java")
              activity.write_text(updated, encoding="utf-8")
              print(f"Updated BASE_URL -> {base_url}")

          if app_id:
              gradle_file = root / "app/build.gradle.kts"
              text = gradle_file.read_text(encoding="utf-8")
              updated = re.sub(r'(applicationId\s*=\s*")([^"]*)(")', r"\1" + app_id + r"\3", text, count=1)
              if updated == text:
                  raise SystemExit("Unable to update applicationId in app/build.gradle.kts")
              gradle_file.write_text(updated, encoding="utf-8")
              print(f"Updated applicationId -> {app_id}")
          PY

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yobble-release.keystore"

      - name: Resolve release key alias
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          STORE_TYPE="${ANDROID_KEYSTORE_TYPE:-PKCS12}"
          DETECTED_ALIAS="$(keytool -list -v \
            -storetype "$STORE_TYPE" \
            -keystore "$RUNNER_TEMP/yobble-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk -F': ' '/Alias name:/{print $2; exit}')"

          if [ -z "$DETECTED_ALIAS" ]; then
            echo "Unable to detect a signing alias from the release keystore." >&2
            exit 1
          fi

          echo "Resolved Android signing alias from keystore metadata."
          echo "RESOLVED_ANDROID_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yobble-release.keystore
          ANDROID_KEY_ALIAS: ${{ env.RESOLVED_ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yobble-debug-apk
          path: Android src/Yobble/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yobble-release-apk
          path: Android src/Yobble/app/build/outputs/apk/release/*.apk
